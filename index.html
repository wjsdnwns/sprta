<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>영어2 본문 학습</title>
<meta name="description" content="상상모의고사K · 영어2 2학기 기말 3·4과 본문 학습 — 한 줄 해석, 문장 배열, 문장 삽입">
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="fonts/pretendard/pretendardvariable-dynamic-subset.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* 상상모의고사K 디자인 토큰 그대로 (index.html :root) + 학습용 토큰(본문 서체·단서 형광) — 흰 바탕 · 1px 선 · 게시판식 표 · LNB */
:root{
  color-scheme:light;
  --ground:#ffffff; --bg2:#f5f6f8; --bg3:#ebedf1; --card:#ffffff;
  --ink:#111111; --ink2:#333333; --sub:#666666; --faint:#8a8a8a; --rule:#e3e4e8; --rule2:#cfd1d6;
  --brand:#2b5cff; --brand-h:#1f4be0; --brand-soft:#eef2ff; --brand-line:#c6d3ff; --on-brand:#ffffff;
  --dark:#2b2d33; --btn:#2b2d33; --btn-h:#3a3d45; --btn-ink:#ffffff;
  --good:#12805c; --good-soft:#e3f5ec; --good-line:#9fd8bf; --bad:#d4351c; --bad-soft:#fdecea; --bad-line:#f2b3a8;
  --subj:#2f8a3e; --subj-soft:#e8f4ea;
  --cue-bg:#fff1b8; --cue-ink:#6b4a00; --cue-line:#e9c64a;
  --shadow:0 10px 30px rgba(17,19,24,.18);
  --sans:'Pretendard Variable','Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --serif:'Source Serif 4','Times New Roman',Georgia,serif;
  --r-sm:4px; --r:8px; --r-lg:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#121419; --bg2:#1a1d24; --bg3:#252a35; --card:#171a21;
  --ink:#f1f2f4; --ink2:#d6d9df; --sub:#a4a9b4; --faint:#7f8592; --rule:#2a2f3a; --rule2:#3b4150;
  --brand:#7493ff; --brand-h:#8ea6ff; --brand-soft:#1c2442; --brand-line:#34427a; --on-brand:#0d1120;
  --dark:#e6e8ec; --btn:#e6e8ec; --btn-h:#ffffff; --btn-ink:#121419;
  --good:#45c793; --good-soft:#13291f; --good-line:#2a6a4f; --bad:#ff8a75; --bad-soft:#351b17; --bad-line:#7a3a2f;
  --subj:#5fbf70; --subj-soft:#17271a;
  --cue-bg:#3d3312; --cue-ink:#f4d374; --cue-line:#8a7020;
  --shadow:0 10px 30px rgba(0,0,0,.55);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#121419; --bg2:#1a1d24; --bg3:#252a35; --card:#171a21;
  --ink:#f1f2f4; --ink2:#d6d9df; --sub:#a4a9b4; --faint:#7f8592; --rule:#2a2f3a; --rule2:#3b4150;
  --brand:#7493ff; --brand-h:#8ea6ff; --brand-soft:#1c2442; --brand-line:#34427a; --on-brand:#0d1120;
  --dark:#e6e8ec; --btn:#e6e8ec; --btn-h:#ffffff; --btn-ink:#121419;
  --good:#45c793; --good-soft:#13291f; --good-line:#2a6a4f; --bad:#ff8a75; --bad-soft:#351b17; --bad-line:#7a3a2f;
  --subj:#5fbf70; --subj-soft:#17271a;
  --cue-bg:#3d3312; --cue-ink:#f4d374; --cue-line:#8a7020;
  --shadow:0 10px 30px rgba(0,0,0,.55);
}
*{box-sizing:border-box}
html{background:var(--ground);scroll-padding-top:120px}
body{margin:0;overflow-x:clip;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:break-word;letter-spacing:-.02em;-webkit-text-size-adjust:100%}
.in{max-width:1240px;margin:0 auto;padding-inline:20px}
button{font:inherit;color:inherit;cursor:pointer;letter-spacing:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1,h2,h3{margin:0;letter-spacing:-.04em;line-height:1.3;text-wrap:balance}
p{margin:0}
.ico{width:1.15em;height:1.15em;flex:none;vertical-align:-.18em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.muted{color:var(--sub);font-size:14px}
.en{font-family:var(--serif);letter-spacing:0;word-break:normal}

/* 버튼·배지 (사이트와 같은 문법) */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:6px;padding:10px 18px;min-height:44px;font-weight:700;font-size:15px;line-height:1.2;border:1px solid var(--btn);background:var(--btn);color:var(--btn-ink);text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--btn-h);border-color:var(--btn-h)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.btn.primary:hover{background:var(--brand-h);border-color:var(--brand-h)}
.btn.ghost{background:var(--card);color:var(--ink);border-color:var(--rule2)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.sm{padding:6px 12px;min-height:34px;font-size:13px;border-radius:4px}
.btn[disabled]{opacity:.45;cursor:default}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:4px;padding:3px 8px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--bg2);color:var(--sub)}
.pill.done{background:var(--good-soft);color:var(--good)}
.pill.ing{background:var(--brand-soft);color:var(--brand)}
.pill.kind{background:var(--subj-soft);color:var(--subj)}
.sw{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--subj);flex:none}

/* 머리 (등급컷 페이지와 같은 짧은 머리) */
.top{background:var(--ground);border-bottom:1px solid var(--rule)}
.top-in{display:flex;align-items:center;justify-content:space-between;gap:12px;height:68px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink);min-width:0}
.logo b{font-weight:800;font-size:22px;letter-spacing:-.06em;display:inline-flex;align-items:center;white-space:nowrap}
.logo b i{font-size:1.4em;font-style:italic;font-weight:900;margin-left:2px;padding-right:.06em;background:linear-gradient(135deg,#1a47ff 0%,#5b8cff 55%,#9fc0ff 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.logo span{font-size:15px;font-weight:700;padding-left:12px;border-left:1px solid var(--rule2);white-space:nowrap}
.top-r{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--sub)}
.top-r a{text-decoration:none;padding:6px 8px}
.top-r a:hover{color:var(--ink);text-decoration:underline;text-underline-offset:3px}
.gnb{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--ground);border-bottom:1px solid var(--rule)}
.gnb-in{display:flex;align-items:center;height:56px;overflow-x:auto;scrollbar-width:none}
.gnb-in::-webkit-scrollbar{display:none}
.gnb-i{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:0 18px;height:56px;font-size:17px;font-weight:700;white-space:nowrap;color:var(--ink);text-decoration:none;position:relative}
.gnb-i:first-child{padding-left:0}
.gnb-i small{font-size:12px;font-weight:600;color:var(--faint)}
.gnb-i:hover,.gnb-i[aria-current="true"]{color:var(--brand)}
.gnb-i[aria-current="true"]::after{content:"";position:absolute;left:18px;right:18px;bottom:-1px;height:3px;background:var(--brand)}
.gnb-i:first-child[aria-current="true"]::after{left:0}
.gnb-sep{width:1px;height:16px;background:var(--rule2);margin:0 6px;flex:none}

/* 페이지 머리 */
.phead{border-bottom:1px solid var(--rule);padding:30px 0 24px}
.phead .in{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:end}
.ph-subj{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--ink2);margin-bottom:8px}
.phead h1{font-size:32px;font-weight:800}
.phead h1 + p{margin-top:8px;color:var(--sub);max-width:60ch}
.ph-stats{display:flex;flex-wrap:wrap;margin:14px 0 0;font-size:14px;row-gap:6px}
.ph-stats div{display:flex;gap:6px;padding:0 14px;border-left:1px solid var(--rule)}
.ph-stats div:first-child{padding-left:0;border-left:0}
.ph-stats dt{color:var(--sub)}.ph-stats dd{margin:0;font-weight:700;font-variant-numeric:tabular-nums}

/* 학습 순서 */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border:1px solid var(--rule2);border-radius:var(--r);margin-top:28px;overflow:hidden}
.step{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 14px;padding:18px 20px;background:var(--card);border:0;border-left:1px solid var(--rule);text-align:left;text-decoration:none;color:var(--ink)}
.step:first-child{border-left:0}
.step:hover{background:var(--bg2)}
.step-n{grid-row:span 2;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--bg3);color:var(--ink2)}
.step:first-child .step-n{background:var(--brand);color:var(--on-brand)}
.step b{font-size:17px}
.step span{font-size:13px;color:var(--sub)}
.resume{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:16px;padding:14px 18px;background:var(--bg2);border-radius:var(--r)}
.resume p{font-size:14px;color:var(--sub);min-width:0}
.resume p b{color:var(--ink)}

/* 과 탭 + 게시판 */
.sec{margin-top:44px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:22px;font-weight:800}
.ltabs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));border:1px solid var(--rule2);border-bottom:0}
.ltab{background:var(--card);border:0;border-left:1px solid var(--rule2);padding:14px 16px;font-size:16px;font-weight:700;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:2px;min-width:0}
.ltab:first-child{border-left:0}
.ltab small{font-size:12px;font-weight:500;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.ltab[aria-selected="true"]{background:var(--dark);color:var(--btn-ink)}
.ltab[aria-selected="true"] small{color:var(--btn-ink);opacity:.7}
.board{width:100%;border-collapse:collapse;border-top:2px solid var(--ink);font-size:14px}
.board th{background:var(--bg2);font-weight:700;color:var(--ink2);padding:11px 10px;border-bottom:1px solid var(--rule2);text-align:center;white-space:nowrap}
.board td{padding:14px 10px;border-bottom:1px solid var(--rule);text-align:center;vertical-align:middle}
.board td.t{text-align:left}
.board .id{font-weight:800;font-variant-numeric:tabular-nums;color:var(--sub)}
.board .tt{display:flex;flex-direction:column;gap:2px;min-width:0}
.board .tt b{font-size:15px}
.board .tt .en{font-size:14px;color:var(--sub)}
.prog{display:inline-flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--sub);white-space:nowrap}
.meter{width:56px;height:6px;border-radius:3px;background:var(--bg3);overflow:hidden;flex:none}
.meter i{display:block;height:100%;background:var(--brand)}
.meter.full i{background:var(--good)}
.acts{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center}

/* 학습 화면 (LNB + 본문) */
.lnb-layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:start;padding-top:32px;padding-bottom:72px}
.lnb{position:sticky;top:76px}
.lnb-t{display:flex;flex-direction:column;justify-content:flex-end;min-height:92px;padding:0 18px 16px;background:var(--brand);color:var(--on-brand);border-radius:var(--r) var(--r) 0 0}
.lnb-t small{font-size:13px;font-weight:600;opacity:.85}
.lnb-t b{font-size:19px;font-weight:800;letter-spacing:-.04em;line-height:1.25}
.lnb-nav{display:grid;border:1px solid var(--rule2);border-top:0;max-height:calc(100vh - 240px);overflow:auto}
.lnb-i{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:8px;width:100%;background:var(--card);border:0;border-top:1px solid var(--rule);padding:12px 14px;font-size:14px;color:var(--ink2);text-align:left;text-decoration:none}
.lnb-i:first-child{border-top:0}
.lnb-i span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lnb-i em{font-style:normal;font-weight:800;font-variant-numeric:tabular-nums;color:var(--faint);font-size:13px}
.lnb-i:hover{background:var(--bg2);color:var(--ink)}
.lnb-i[aria-current="true"]{color:var(--brand);font-weight:700}
.lnb-i[aria-current="true"] em{color:var(--brand)}
.lnb-i .ok{color:var(--good);width:16px;height:16px}
.lnb-i .dot{width:6px;height:6px;border-radius:50%;background:var(--rule2)}
.lnb-l{display:flex;gap:0;border:1px solid var(--rule2);border-top:0}
.lnb-l button{flex:1;background:var(--bg2);border:0;border-left:1px solid var(--rule2);padding:8px 0;font-size:13px;font-weight:700;color:var(--sub)}
.lnb-l button:first-child{border-left:0}
.lnb-l button[aria-pressed="true"]{background:var(--card);color:var(--ink)}
.main{min-width:0}
.crumb{display:flex;align-items:center;flex-wrap:wrap;gap:4px;font-size:13px;color:var(--faint)}
.crumb a{text-decoration:none}.crumb a:hover{color:var(--ink)}
.crumb .ico{width:12px;height:12px;color:var(--rule2)}
.ptitle{margin-top:14px;display:grid;gap:6px}
.ptitle .tags{display:flex;align-items:center;flex-wrap:wrap;gap:6px;font-size:13px;color:var(--sub)}
.ptitle h2{font-family:var(--serif);font-weight:600;font-size:28px;letter-spacing:-.01em}
.ptitle p{font-size:15px;color:var(--ink2)}
.pick{display:none;margin-top:12px}
.pick select{width:100%;min-height:44px;border:1px solid var(--rule2);border-radius:6px;padding:0 12px;background:var(--card);color:var(--ink);font:inherit;font-size:15px}
.mtabs{display:flex;gap:0;margin-top:22px;border-bottom:2px solid var(--ink);overflow-x:auto;scrollbar-width:none}
.mtabs::-webkit-scrollbar{display:none}
.mtab{background:none;border:0;padding:10px 16px;font-size:15px;font-weight:700;color:var(--sub);white-space:nowrap;position:relative;text-decoration:none}
.mtab[aria-selected="true"]{color:var(--ink)}
.mtab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-2px;height:4px;background:var(--brand)}
.mtab small{font-weight:600;color:var(--faint);margin-left:4px;font-size:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:10px 16px;flex-wrap:wrap;padding:14px 0;border-bottom:1px solid var(--rule)}
.bar p{font-size:14px;color:var(--sub);min-width:0;flex:1 1 260px}
.bar-r{display:flex;gap:6px;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--rule2);border-radius:6px;overflow:hidden}
.seg button{background:var(--card);border:0;border-left:1px solid var(--rule2);padding:7px 12px;font-size:13px;font-weight:700;color:var(--sub);min-height:36px}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"]{background:var(--dark);color:var(--btn-ink)}
.tog{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--rule2);border-radius:6px;padding:7px 12px;font-size:13px;font-weight:700;color:var(--sub);min-height:36px}
.tog[aria-pressed="true"]{border-color:var(--cue-line);background:var(--cue-bg);color:var(--cue-ink)}

/* 단어 상자 */
.vocab{margin-top:18px;border:1px solid var(--rule);border-radius:var(--r);background:var(--bg2)}
.vocab summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;font-size:14px;font-weight:700}
.vocab summary::-webkit-details-marker{display:none}
.vocab summary span{font-weight:500;color:var(--faint);font-size:13px}
.vocab ul{list-style:none;margin:0;padding:0 16px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:6px 18px}
.vocab li{display:flex;gap:8px;align-items:baseline;font-size:14px;border-bottom:1px dashed var(--rule2);padding:4px 0;min-width:0}
.vocab li b{font-family:var(--serif);font-weight:600;font-size:15px;letter-spacing:0;white-space:nowrap}
.vocab li span{color:var(--sub);font-size:13px}

/* 첫단추: 한 줄 영어 · 한 줄 해석 */
.lines{list-style:none;margin:8px 0 0;padding:0}
.ln{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:4px 12px;padding:16px 0;border-bottom:1px solid var(--rule)}
.ln-n{font-weight:800;font-size:14px;color:var(--faint);font-variant-numeric:tabular-nums;padding-top:3px}
.ln-para{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--subj);letter-spacing:.04em;margin:-2px 0 2px}
.ln-b{display:grid;gap:6px;min-width:0}
.ln .en{font-size:19px;line-height:1.6;color:var(--ink)}
.ln .ko{font-size:15px;line-height:1.6;color:var(--ink2)}
.ln-a{display:flex;gap:2px;align-items:flex-start}
.ib{display:inline-grid;place-items:center;width:36px;height:36px;border:0;border-radius:6px;background:none;color:var(--faint)}
.ib:hover{background:var(--bg2);color:var(--ink)}
.cover{display:block;width:100%;text-align:left;border:1px dashed var(--rule2);background:var(--bg2);border-radius:6px;padding:8px 12px;font-size:13px;font-weight:600;color:var(--faint)}
.cover:hover{border-color:var(--brand);color:var(--brand)}
.vw{background:none;color:inherit;border-bottom:1px dotted var(--faint);cursor:help;position:relative}
.vw[data-open]::after{content:attr(data-m);position:absolute;left:0;bottom:calc(100% + 6px);background:var(--dark);color:var(--btn-ink);font-family:var(--sans);font-size:12px;font-weight:700;line-height:1.3;padding:5px 8px;border-radius:4px;width:max-content;max-width:min(220px,70vw);white-space:normal;z-index:5;letter-spacing:-.01em}
.cue{background:var(--cue-bg);color:inherit;box-shadow:inset 0 -2px 0 var(--cue-line);border-radius:2px;padding:0 1px}
.links{display:grid;gap:3px;margin-top:2px}
.link{display:flex;gap:6px;align-items:baseline;font-size:13px;color:var(--cue-ink)}
.link b{font-family:var(--serif);font-weight:600;font-size:14px;letter-spacing:0;white-space:nowrap}
.link .ico{width:13px;height:13px;flex:none;transform:translateY(2px)}
.done-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:24px;padding:18px 20px;border:1px solid var(--rule2);border-radius:var(--r)}
.done-row p{font-size:14px;color:var(--sub);flex:1 1 240px}
.done-row .bar-r{gap:8px}

/* 드래그 공통 */
[data-handle],[data-drag="free"],[data-drag="ins"]{touch-action:none}
.lifted{box-shadow:var(--shadow)!important;cursor:grabbing!important;opacity:.97}
.ph{border:2px dashed var(--brand-line)!important;background:var(--brand-soft)!important;border-radius:var(--r)}
body.dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}

/* 배열: 문장 카드 */
.olist{list-style:none;margin:16px 0 0;padding:0;display:grid;gap:8px}
.card{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:stretch;background:var(--card);border:1px solid var(--rule2);border-radius:var(--r);cursor:grab;transition:border-color .12s}
.card:hover{border-color:var(--ink2)}
.card .grip{display:grid;place-items:center;color:var(--faint);border-right:1px solid var(--rule);border-radius:var(--r) 0 0 var(--r);background:var(--bg2)}
.card .grip .ico{width:18px;height:18px}
.card .body{padding:12px 14px;display:grid;gap:4px;min-width:0}
.card .body .en{font-size:16.5px;line-height:1.55}
.card .body .ko{font-size:13.5px;color:var(--sub)}
.card .mk{display:grid;place-items:center;width:40px;font-weight:800;font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.card.fixed{cursor:default;background:var(--bg2);border-style:dashed}
.card.fixed .grip{background:transparent}
.card.sel{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.card.ok{border-color:var(--good-line);background:var(--good-soft)}
.card.ok .mk{color:var(--good)}
.card.no{border-color:var(--bad-line);background:var(--bad-soft)}
.card.no .mk{color:var(--bad)}
.card .lab{font-family:var(--serif);font-weight:600;font-size:17px;color:var(--ink)}
.acts-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.score{font-size:14px;color:var(--sub);margin-top:12px;font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.given{border:1px solid var(--ink);border-radius:var(--r);padding:14px 16px;margin-top:16px;background:var(--card)}
.given small{display:block;font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em;margin-bottom:4px}
.given .en{font-size:16.5px;line-height:1.6}

/* 결과 해설 */
.result{margin-top:20px;border:1px solid var(--good-line);background:var(--good-soft);border-radius:var(--r);padding:18px 20px;display:grid;gap:12px}
.result.reveal{border-color:var(--rule2);background:var(--bg2)}
.result h3{font-size:17px;display:flex;align-items:center;gap:6px;color:var(--good)}
.result.reveal h3{color:var(--ink)}
.result h3 .ico{width:20px;height:20px}
.result .ans{font-family:var(--serif);font-weight:600;font-size:18px;letter-spacing:0}
.why{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.why li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 10px;font-size:14px;background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:10px 12px}
.why li > b{grid-row:span 2;font-variant-numeric:tabular-nums;color:var(--sub);font-size:13px;padding-top:2px}
.why .en{font-size:15px}
.why .k{color:var(--cue-ink);font-size:13.5px}
.ctx{display:grid;gap:6px;font-size:14px}
.ctx div{display:grid;grid-template-columns:64px minmax(0,1fr);gap:8px}
.ctx dt{font-size:12px;font-weight:800;color:var(--faint);padding-top:2px}
.ctx dd{margin:0;color:var(--ink2)}
.ctx .me dd{color:var(--ink);font-weight:700}

/* 단어 배열 */
.wq{margin-top:16px;border:1px solid var(--rule2);border-radius:var(--r);padding:18px 18px 16px;background:var(--card)}
.wq-h{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--faint);font-weight:700}
.wq-ko{margin-top:8px;font-size:17px;font-weight:700;line-height:1.55}
.wline{margin-top:16px;min-height:64px;padding:10px;border:2px dashed var(--rule2);border-radius:var(--r);display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start;background:var(--bg2)}
.wline.ok{border-color:var(--good);border-style:solid;background:var(--good-soft)}
.wline.no{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.wline:empty::before{content:"아래 조각을 눌러 순서대로 놓으세요";color:var(--faint);font-size:13px;padding:8px 4px}
.wbank{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px;min-height:48px}
.chip{display:inline-flex;align-items:center;padding:9px 13px;border:1px solid var(--rule2);border-radius:6px;background:var(--card);font-family:var(--serif);font-size:16.5px;line-height:1.25;letter-spacing:0;cursor:grab;color:var(--ink);text-align:left;max-width:100%}
.chip:hover{border-color:var(--ink2)}
.wline .chip{border-color:var(--brand-line);background:var(--card)}
.chip.bad{border-color:var(--bad);color:var(--bad)}
.wdots{display:flex;flex-wrap:wrap;gap:5px;margin-top:14px}
.wdot{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule2);background:var(--card);font-size:12px;font-weight:700;color:var(--faint);font-variant-numeric:tabular-nums;padding:0}
.wdot.solved{background:var(--good-soft);border-color:var(--good-line);color:var(--good)}
.wdot[aria-current="true"]{border-color:var(--brand);color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}

/* 삽입 */
.ins-given{position:sticky;top:64px;z-index:20;margin-top:16px;border:1.5px solid var(--ink);border-radius:var(--r);background:var(--card);display:grid;grid-template-columns:44px minmax(0,1fr);box-shadow:0 6px 16px -10px rgba(0,0,0,.35);cursor:grab}
.ins-given .grip{display:grid;place-items:center;border-right:1px solid var(--rule);color:var(--faint);background:var(--bg2);border-radius:var(--r) 0 0 var(--r)}
.ins-given .body{padding:12px 14px;display:grid;gap:4px;min-width:0}
.ins-given small{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.04em}
.ins-given .en{font-size:16.5px;line-height:1.55}
.ins-given .ko{font-size:13.5px;color:var(--sub)}
.drag-ghost{position:fixed;z-index:100;pointer-events:none;box-shadow:var(--shadow);max-width:min(560px,90vw);opacity:.96}
.pass{margin-top:18px;border:1px solid var(--rule2);border-radius:var(--r);padding:20px 22px;background:var(--card)}
.pass p{font-family:var(--serif);font-size:18px;line-height:2.05;letter-spacing:0;color:var(--ink)}
.pass p + p{margin-top:10px;text-indent:1.2em}
.gap{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;margin:0 3px;padding:0 8px;border:1.5px solid var(--ink2);border-radius:15px;background:var(--card);font-family:var(--sans);font-size:14px;font-weight:800;color:var(--ink);vertical-align:1px;text-indent:0;transition:transform .1s}
.gap:hover,.gap.hot{border-color:var(--brand);background:var(--brand-soft);color:var(--brand);transform:scale(1.12)}
.gap.no{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.gap.ok{border-color:var(--good);background:var(--good-soft);color:var(--good)}
.slot{display:inline;background:var(--good-soft);box-shadow:inset 0 -2px 0 var(--good-line);border-radius:2px;padding:1px 2px}
.slot.reveal{background:var(--brand-soft);box-shadow:inset 0 -2px 0 var(--brand-line)}
.tick{width:9px;height:9px;display:inline-block;border-radius:50%;background:var(--rule2);vertical-align:1px;margin:0 6px}
.shake{animation:shake .32s}
@keyframes shake{20%{transform:translateX(-5px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(3px)}}
.pop{animation:pop .3s}
@keyframes pop{50%{transform:scale(1.04)}}
@media (prefers-reduced-motion:reduce){.shake,.pop{animation:none}.gap{transition:none}}

/* 계정 */
.acct{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:13px;color:var(--sub);min-width:0}
.acct-who{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:280px}
.acct-who b{color:var(--ink)}
.acct-who em{font-style:normal;color:var(--bad)}
.acct-dot{width:8px;height:8px;border-radius:50%;background:var(--good);flex:none}
.acct-dot.bad{background:var(--bad)}
.acct-btn{background:var(--card);border:1px solid var(--rule2);border-radius:4px;padding:5px 10px;font-size:12px;font-weight:700;color:var(--sub);white-space:nowrap}
.acct-btn:hover{border-color:var(--ink);color:var(--ink)}
.acct-note{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:12px;padding:14px 18px;border:1px solid var(--brand-line);background:var(--brand-soft);border-radius:var(--r)}
.acct-note p{font-size:14px;color:var(--ink2);flex:1 1 280px}
.acct-ok{display:flex;align-items:center;gap:6px;margin-top:12px;font-size:14px;color:var(--good)}
.acct-ok b{color:var(--ink)}
.foot{border-top:1px solid var(--rule);padding:22px 0 36px;font-size:13px;color:var(--faint)}
.foot .in{display:grid;gap:4px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--dark);color:var(--btn-ink);padding:11px 18px;border-radius:6px;font-size:14px;font-weight:700;z-index:200;max-width:calc(100vw - 32px)}

@media (max-width:960px){
  .lnb-layout{grid-template-columns:minmax(0,1fr);gap:0;padding-top:20px}
  .lnb{display:none}
  .pick{display:block}
  .steps{grid-template-columns:minmax(0,1fr)}
  .step{border-left:0;border-top:1px solid var(--rule)}
  .step:first-child{border-top:0}
}
@media (max-width:720px){
  .in{padding-inline:16px}
  .top-in{height:56px}
  .logo b{font-size:19px}
  .logo span{font-size:14px;padding-left:10px}
  .top-r{display:none}
  .acct-who{display:none}
  .acct .btn.sm{min-height:32px;padding:5px 10px}
  .gnb-in{height:48px}
  .gnb-i{height:48px;font-size:15px;padding:0 12px}
  .gnb-i small{display:none}
  .gnb-i[aria-current="true"]::after{left:12px;right:12px}
  .phead{padding:22px 0 18px}
  .phead .in{grid-template-columns:minmax(0,1fr)}
  .phead h1{font-size:26px}
  .ptitle h2{font-size:23px}
  .board thead{display:none}
  .board,.board tbody,.board tr,.board td{display:block;width:100%}
  .board tr{padding:14px 0;border-bottom:1px solid var(--rule)}
  .board td{border:0;padding:3px 0;text-align:left}
  .board td.id{display:none}
  .board td[data-l]{display:flex;justify-content:space-between;align-items:center}
  .board td[data-l]::before{content:attr(data-l);font-size:13px;color:var(--faint);font-weight:700}
  .board td.pg{display:none}
  .board td.a{padding-top:10px}
  .acts{justify-content:flex-start}
  .ln{grid-template-columns:26px minmax(0,1fr);padding:14px 0}
  .ln-a{grid-column:2;justify-content:flex-start;margin-left:-8px}
  .ln .en{font-size:17.5px}
  .card{grid-template-columns:40px minmax(0,1fr) auto}
  .card .body .en{font-size:15.5px}
  .pass{padding:16px}
  .pass p{font-size:16.5px;line-height:2.1}
  .ins-given{top:56px}
  .chip{font-size:15.5px;padding:8px 11px}
  .wq{padding:14px}
  .wq-ko{font-size:16px}
}
</style>
